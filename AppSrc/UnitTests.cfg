; UnitTests.cfg - project settings for the DFUnit test program.
;
; Platform=x64 makes a command-line build produce UnitTests64.exe rather than silently
; falling back to 32-bit.
; The manifest is a fixed file kept with the source, UnitTests64.exe.manifest: it is embedded
; (EmbedManifestFile=1) but never written (BuildManifestFile=0). df-cli does not write a
; manifest, so a written one would be missing on a build server ("manifest file cannot be
; found"); the fixed one is there for the Studio and df-cli alike, and gives the test-runner
; window the new common controls.
[Application]
IsWebApp=0
BuildManifestFile=0
EmbedManifestFile=1
DPIAware=1
AutoGenerateMenus=0
CompilerWarnings=1
[Compiler]
Platform=x64
64BitSuffix=64
32BitSuffix=
BeforeCompileProcessEnabled=0
AfterCompileProcessEnabled=0
[Version]
Include=0
AutoIncrementBuild=0
